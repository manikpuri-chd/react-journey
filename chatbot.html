<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput(){
            return (
                <div>
                    <input placeholder="Send a message to Chatbox" size="30"/>
                    <button> Send </button>
                </div>
            );
        }

        function ChatMessage({message,sender}){
          // const message = props.message;
          // const sender = props.sender;

          // const { message,sender } = props;

          // if(sender === 'robot') {
          //   return(
          //     <div>
          //   <img src="robot.png" width="50px"/>
          //   {message}
          //   </div>
          // )
          // }

          return(
            <div>
              {sender==='robot'&& <img src="robot.png" width="50px"/>}
              {message}
              {sender ==='user' && <img src="user.png" width="50px" />}
            </div>
          )
        }

        function ChatMessages(){
          const array = React.useState([
            {

            message:'hello chatbot',
            sender:'user',
            id:'id1'
          },{
            message:'Hello! How can I help you?',
            sender:'robot',
            id:'id2'
          },{
            message:'what is the date today ?',
            sender:'user',
            id:'id3'
          },{
            message:'Today is September 24',
            sender:'robot',
            id:'id4'
           }
          ])
          const chatMessages = array[0];
          const setChatMessages = array[1];
          
          function sendMessage(){
           setChatMessages([
            ...chatMessages,
            {
              message:'test',
              sender:'user',
              id:crypto.randomUUID()
            }
           ]);
          }
           return(
              <>
                  <button onClick={sendMessage} > Send Message </button>
                  {chatMessages.map((chatMessage)=>{
                         return(
                         <ChatMessage
                         message={chatMessage.message}
                         sender={chatMessage.sender}
                         key={chatMessage.id}
                  />
                      );

                  })}
              </>
              
          )
          }
        function App(){
          return(
                <>
                <ChatInput />
                <ChatMessages />
                    
                </>
              
          )
              };
                 
        const container = document.querySelector('.js-container');

      ReactDOM.createRoot(container).render(<App></App>);

    </script>
  </body>
</html>
